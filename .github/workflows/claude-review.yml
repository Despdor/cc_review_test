name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同一 PR 连续 push 时取消旧的评审，只审最新提交
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 跳过草稿 PR
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # 二选一：订阅用户用 `claude setup-token` 生成的 token；或改用 anthropic_api_key
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            你是这个仓库的代码评审人。用 `gh pr diff` 只看本 PR 的改动，必要时读取相关文件确认上下文。

            重点找真正的缺陷，按严重度排序：
            1. 正确性：逻辑错误、边界条件、空值/未定义访问、错误被吞掉导致失败被当成成功
            2. 并发与资源：竞态、非原子写、锁、子进程/句柄泄漏
            3. 安全：注入、路径穿越、密钥泄露
            4. 跨平台：Windows 路径、CRLF、shell 引号
            5. 文档与实现不一致、缺少测试

            要求：
            - 每个问题必须基于实际代码确认，不确定的标注"可能"；不要报风格类小问题
            - 具体问题用行内评论（mcp__github_inline_comment__create_inline_comment），写明问题、触发场景、修改建议
            - 最后用 `gh pr comment` 发一条中文总结：结论（可合入 / 需修改）+ 问题列表
            - 没发现问题就直接说明，不要凑数
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
